version: 1
disable_existing_loggers: false

formatters:
  json:
    "()": pythonjsonlogger.jsonlogger.JsonFormatter
    fmt: "%(asctime)s %(levelname)s %(name)s %(module)s %(message)s"

handlers:
  default:
    class: logging.StreamHandler
    formatter: json
    level: DEBUG   # overridden by logger level

loggers:
  codebusters:
    handlers: [default]
    level: DEBUG   # overridden by environment variable
    propagate: true

  uvicorn.error:
    handlers: [default]
    level: DEBUG   # overridden by environment variable
    propagate: true

  uvicorn.access:
    handlers: [default]
    level: DEBUG   # overridden by environment variable
    propagate: true

root:
  handlers: [default]
  level: DEBUG
